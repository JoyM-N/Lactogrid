[project]
name = "lactogrid"
version = "0.1.0"
description = "Solar-powered milk cooling as a service for dairy collection centres"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "paho-mqtt>=2.1",
    "reportlab>=4.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
cloud = [
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shared*", "simulator*", "edge*", "cloud*"]
